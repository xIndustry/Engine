<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waystem</title>

<style>
/* =========================
   RESET & VARIABLES
========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Helvetica Neue", Arial, sans-serif;
}

:root {
    --muted: #9aa6b2;
    --accent: #00d1b2;
}

/* =========================
   BASE
========================= */
html {
    overflow-y: scroll;
    scrollbar-width: thin;
    scrollbar-color: #fff #000;
}

body {
    background: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER / NAV
========================= */
.sticky-bar {
    position: sticky;
    top: 0;
    height: 130px;
    background: #000;
    z-index: 999;
    display: flex;
    justify-content: center;
    align-items: center;
}

.nav-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.company-name {
    font-size: 58px;
    font-weight: bold;
    text-transform: uppercase;
    text-decoration: none;
    color: #fff;
}

.nav-links {
    list-style: none;
    margin-top: 18px;
    display: flex;
    text-transform: uppercase;
}

.nav-links li {
    margin: 0 10px;
}

.nav-links a {
    color: #fff;
    text-decoration: none;
    padding: 7px 9px;
    font-size: 16px;
    position: relative;
}

.nav-links a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -3px;
    height: 3px;
    background: #fff;
    transform: scaleX(0);
    transition: transform 0.6s ease;
}

.nav-links a:hover::after {
    transform: scaleX(1);
    box-shadow: 0 0 10px rgba(255,255,255,0.8);
}

/* =========================
   LAYOUT
========================= */
.wrap {
    flex: 1;
    padding: 30px 8%;
}

/* =========================
   BACKGROUND (THREE.JS)
========================= */
.background {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
}

#three-canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(
        circle at center,
        rgba(0,0,0,0) 30%,
        rgba(0,0,0,0.6) 90%
    );
    z-index: 1;
}

/* =========================
   HERO / UNIVERSE
========================= */
.Universe {
    position: relative;
    z-index: 1;
    height: calc(100vh - 250px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.Energy {
    padding: 1rem;
    animation: fadeIn 2s ease forwards;
    opacity: 0;
}

.Universe h1 {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.2;
}

.Universe p {
    margin-top: 1rem;
    font-size: 1.25rem;
    color: #ccc;
    max-width: 600px;
}

/* =========================
   FOOTER (ISOLATED)
========================= */
footer {
    all: unset;
    position: fixed;
    bottom: 0;
    width: 100%;
    padding: 19px;
    background: #000;
    display: flex;
    justify-content: center;
    z-index: 1000;
}

footer p {
    all: unset;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
}

/* =========================
   SCROLLBAR (WEBKIT)
========================= */
html::-webkit-scrollbar {
    width: 12px;
}
html::-webkit-scrollbar-track {
    background: #1e1e1e;
}
html::-webkit-scrollbar-thumb {
    background: #ffffff;
    border-radius: 6px;
    border: 3px solid #000000;
}

/* =========================
   ANIMATION
========================= */
@keyframes fadeIn {
    to { opacity: 1; }
}

/* =========================
   RESPONSIVE
========================= */
@media (max-width: 480px) {
    .company-name { font-size: 58px; }
    .nav-links li { margin: 0 5px; }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div class="background">
    <canvas id="three-canvas"></canvas>
    <div class="overlay"></div>
</div>

<header class="sticky-bar">
    <nav class="nav-container">
        <a href="index.html" class="company-name">Waystem</a>
        <ul class="nav-links">
            <li><a href="about.html">About</a></li>
            <li><a href="solutions.html">Solutions</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main class="wrap">
    <section class="Universe">
        <div class="Energy">
            <h1>A Universe of Energy</h1>
            <p>Where Research & Development Unlocks Possibilities.</p>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Waystem</p>
</footer>

<script>
const canvas = document.getElementById("three-canvas");
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const circleTexture = new THREE.TextureLoader().load(
    "data:image/svg+xml;base64," + btoa(
        `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
            <circle cx="32" cy="32" r="32" fill="white"/>
        </svg>`
    )
);

const particleCount = 3000;
const positions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    positions[i3]     = (Math.random() - 0.5) * 50;
    positions[i3 + 1] = (Math.random() - 0.5) * 30;
    positions[i3 + 2] = (Math.random() - 0.5) * 50;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

const material = new THREE.PointsMaterial({
    map: circleTexture,
    size: 0.06,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const points = new THREE.Points(geometry, material);
scene.add(points);

const clock = new THREE.Clock();
function animate() {
    const t = clock.getElapsedTime();
    points.rotation.y = t * 0.05;
    points.rotation.x = Math.sin(t * 0.2) * 0.05;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>

</body>
</html>
