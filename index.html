<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waystem</title>

    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        :root {
            --card: #0b1220;
            --muted: #9aa6b2;
            --accent: #00d1b2;
        }

        html {
            overflow-y: scroll;
            scrollbar-width: thin;
            scrollbar-color: #fff #000;
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header & Navigation */
        .sticky-bar {
            position: sticky;
            top: 0;
            width: 100%;
            height: 130px;
            background: #000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .company-name {
            font-size: 58px;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            margin-top: 18px;
            display: flex;
            text-transform: uppercase;
        }

        .nav-links li {
            margin: 0 10px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            padding: 7px 9px;
            position: relative;
            font-size: 16px;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -3px;
            height: 3px;
            background: #fff;
            transform: scaleX(0);
            transition: transform 0.6s ease;
        }

        .nav-links a:hover::after {
            transform: scaleX(1);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Layout */
        .wrap {
            flex: 1;
            padding: 30px 8%;
            width: 100%;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
        }

        h1 {
            font-size: clamp(22px, 6vw, 36px);
            margin-bottom: 10px;
        }

        h2 {
            font-size: clamp(18px, 5vw, 28px);
            margin-bottom: 12px;
        }

        p.lead {
            font-size: clamp(14px, 3.6vw, 18px);
            margin: 8px 0 22px;
            line-height: 1.5;
        }

        p.lead a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }

        p.lead a:hover {
            color: var(--accent);
        }

        /* Values */
        .values {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .value {
            width: 100%;
            padding: 9px;
            border-radius: 9px;
            background: #1b1a1a;
            border: 16px solid rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(8px);
        }

        .value strong {
            font-size: clamp(14px, 3.6vw, 18px);
            display: block;
        }

        .value div {
            color: var(--muted);
            font-size: clamp(13px, 3.6vw, 16px);
            margin-top: 6px;
        }

        /* Scrollbar */
        html::-webkit-scrollbar {
            width: 12px;
        }

        html::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        html::-webkit-scrollbar-thumb {
            background: #fff;
            border-radius: 6px;
            border: 3px solid #1e1e1e;
        }

        /* Footer */
        footer {
            padding: 19px;
            text-align: center;
            background: #000;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: auto;
        }

        footer p {
            font-size: 14px;
        }

        /* Responsive */
        @media (min-width: 900px) {
            .value {
                width: calc(33.33% - 10px);
            }
        }

        @media (max-width: 480px) {
            .company-name {
                font-size: 58px;
            }

            .nav-links li {
                margin: 0 5px;
            }
        }

        /* Three.js layers */
        #three-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .content-layer {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <header class="sticky-bar">
        <nav class="nav-container">
            <a href="index.html" class="company-name">Waystem</a>

            <ul class="nav-links">
                <li><a href="about.html">About</a></li>
                <li><a href="solutions.html">Solutions</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="wrap">
        <canvas id="three-canvas"></canvas>
        <div class="content-layer"></div>

        <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
        <script>
            const canvas = document.getElementById("three-canvas");
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(
                75,
                canvas.clientWidth / canvas.clientHeight,
                0.1,
                1000
            );
            camera.position.z = 8;

            const renderer = new THREE.WebGLRenderer({
                canvas,
                alpha: true,
                antialias: true,
            });

            function resizeRenderer() {
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                renderer.setSize(width, height, false);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            }

            resizeRenderer();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const circleTexture = new THREE.TextureLoader().load(
                "data:image/svg+xml;base64," +
                btoa(`
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
              <circle cx="32" cy="32" r="32" fill="white"/>
            </svg>
          `)
            );

            const particleCount = 3000;
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                positions[i3] = (Math.random() - 0.5) * 50;
                positions[i3 + 1] = (Math.random() - 0.5) * 30;
                positions[i3 + 2] = (Math.random() - 0.5) * 50;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute(
                "position",
                new THREE.BufferAttribute(positions, 3)
            );

            const material = new THREE.PointsMaterial({
                map: circleTexture,
                size: 0.06,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            const clock = new THREE.Clock();

            function animate() {
                const t = clock.getElapsedTime();
                points.rotation.y = t * 0.05;
                points.rotation.x = Math.sin(t * 0.2) * 0.05;
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }

            window.addEventListener("resize", resizeRenderer);
            animate();
        </script>
    </main>

    <footer>
        <p>&copy; 2026 Waystem</p>
    </footer>
</body>
