<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        :root {
            --card: #0b1220;
            --muted: #9aa6b2;
            --accent: #00d1b2;
        }

        html {
            overflow-y: scroll;
            scrollbar-width: thin;
            scrollbar-color: #fff #000000;
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header & Navigation */
        .sticky-bar {
            position: sticky;
            top: 0;
            width: 100%;
            height: 130px;
            background: #000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .company-name {
            font-size: 58px;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            margin-top: 18px;
            display: flex;
            text-transform: uppercase;
        }

        .nav-links li {
            margin: 0 10px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            padding: 7px 9px;
            position: relative;
            font-size: 16px;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -3px;
            height: 3px;
            background: #fff;
            transform: scaleX(0);
            transition: transform 0.6s ease;
        }

        .nav-links a:hover::after {
            transform: scaleX(1);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Layout Main - WRAP SECTION */
        .wrap {
            flex: 1;
            padding: 30px 8%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: calc(100vh - 130px);
        }

        .wrap .top-content {
            flex: 0 0 auto;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .wrap h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #fff;
            font-weight: 600;
        }

        .wrap h2 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #fff;
            font-weight: 400;
        }

        /* Form Styling - ONLY INSIDE WRAP */
        .wrap .messageForm {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            padding-top: 30px;
            gap: 0;
            max-width: 800px;
        }

        .wrap .inputGroup {
            margin: 18px 0;
            position: relative;
        }

        .wrap .messageForm .halfWidth {
            flex-basis: 48%;
        }

        .wrap .messageForm .fullWidth {
            flex-basis: 100%;
        }

        .wrap .messageForm input,
        .wrap .messageForm textarea {
            width: 100%;
            font-size: 18px;
            padding: 8px 0;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-bottom: 2px solid #666;
            outline: none;
            transition: border-color 0.3s;
        }

        .wrap .messageForm input:focus,
        .wrap .messageForm textarea:focus {
            border-bottom-color: #a6522a;
        }

        .wrap .messageForm textarea {
            resize: none;
            height: 120px;
            display: block;
        }

        .wrap textarea::-webkit-scrollbar {
            width: 5px;
        }

        .wrap textarea::-webkit-scrollbar-track {
            background-color: #1e1e1e;
            border-radius: 15px;
        }

        .wrap textarea::-webkit-scrollbar-thumb {
            background-color: #a6522a;
            border-radius: 15px;
        }

        .wrap .inputGroup label {
            position: absolute;
            left: 0;
            bottom: 10px;
            color: #888;
            font-size: 18px;
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .wrap .inputGroup input:focus ~ label,
        .wrap .inputGroup textarea:focus ~ label,
        .wrap .inputGroup input:valid ~ label,
        .wrap .inputGroup textarea:valid ~ label {
            transform: translateY(-30px);
            font-size: 14px;
            color: #a6522a;
        }

        .wrap .messageForm textarea:focus + label,
        .wrap .messageForm textarea:valid + label {
            transform: translateY(-130px);
        }

        .wrap .inputGroup button {
            padding: 13px 20px;
            width: 100%;
            font-size: 18px;
            background-color: #a6522a;
            color: #fff;
            border: 1px solid transparent;
            border-radius: 25px;
            outline: none;
            cursor: pointer;
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.521);
            transition: all 0.4s ease;
            font-weight: 500;
        }

        .wrap .inputGroup button:hover {
            background-color: #8b4123;
            color: #ffffff;
            box-shadow: 0px 0px 20px rgba(166, 82, 42, 0.5);
            transform: translateY(-2px);
        }

        /* Bottom Contact Section - INSIDE WRAP */
        .wrap .bottom-contact {
            flex: 0 0 auto;
            width: 100%;
            margin-top: 80px;
            padding-top: 0;
        }

        .wrap .contact-header {
            margin-bottom: 30px;
        }

        .wrap .contact-header h2 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #fff;
            font-weight: 600;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }

        .wrap .contact-header h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50%;
            height: 3px;
            background-color: #a6522a;
        }

        .wrap .contact-header p {
            font-size: 16px;
            color: #9aa6b2;
            margin-top: 15px;
            line-height: 1.5;
        }

        .wrap .contact-details {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .wrap .contact-details li {
            margin-bottom: 30px;
            font-size: 17px;
            color: #fff;
            line-height: 1.6;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .wrap .contact-details li:last-child {
            margin-bottom: 0;
        }

        .wrap .contact-details li i {
            font-size: 22px;
            color: #fff;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .wrap .contact-details li .contact-text {
            flex: 1;
        }

        .wrap .social-section {
            margin-top: 50px;
            text-align: center;
        }

        .wrap .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .wrap .social-icons a {
            display: inline-block;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .wrap .social-icons a i {
            font-size: 24px;
            color: #fff;
        }

        .wrap .social-icons a:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .wrap .social-icons a.facebook:hover {
            background-color: #1877f2;
        }

        .wrap .social-icons a.instagram:hover {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .wrap .social-icons a.twitter:hover {
            background-color: #000000;
        }

        .wrap .social-icons a.youtube:hover {
            background-color: #ff0000;
        }

        .wrap .social-icons a.linkedin:hover {
            background-color: #0077b5;
        }

        /* Footer */
        footer {
            padding: 19px;
            text-align: center;
            background: #000;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: auto;
        }

        footer p {
            font-size: 14px;
        }

        /* Scrollbar Styling */
        html::-webkit-scrollbar {
            width: 12px;
        }

        html::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        html::-webkit-scrollbar-thumb {
            background: #fff;
            border-radius: 6px;
            border: 3px solid #1e1e1e;
        }

        /* Responsive Breakpoints */
        @media (max-width: 1100px) {
            .wrap .messageForm .halfWidth {
                flex-basis: 100%;
            }
        }

        @media (max-width: 900px) {
            .sticky-bar .nav-links li {
                margin: 0 8px;
            }
        }

        @media (max-width: 768px) {
            .wrap .social-icons {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .company-name {
                font-size: 48px;
            }

            .nav-links li {
                margin: 0 5px;
            }

            .wrap h1 {
                font-size: 36px;
            }

            .wrap {
                padding: 20px 5%;
            }

            .wrap .bottom-contact {
                margin-top: 50px;
            }

            .wrap .social-icons a {
                width: 45px;
                height: 45px;
            }

            .wrap .social-icons a i {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="sticky-bar">
        <nav class="nav-container">
            <a href="index.html" class="company-name">Waystem</a>
            <ul class="nav-links">
                <li><a href="about.html">About</a></li>
                <li><a href="solutions.html">Solutions</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="wrap">
        <div class="top-content">
            <h1>Contact</h1>
            <h2>Let's Get in Touch.</h2>
            <form class='messageForm' method='post'>
                <input type='hidden' name='form-name' value='form 1' />
                <div class="inputGroup halfWidth">
                    <input type="text" name="name" required="required">
                    <label>Your Name</label>
                </div>
                <div class="inputGroup halfWidth">
                    <input type="email" name="email" required="required">
                    <label>Email</label>
                </div>
                <div class="inputGroup fullWidth">
                    <input type="text" name="subject" required="required">
                    <label>Subject</label>
                </div>
                <div class="inputGroup fullWidth">
                    <textarea name="message" required="required"></textarea>
                    <label>Your Message</label>
                </div>
                <div class="inputGroup fullWidth">
                    <button type="submit">Send Message</button>
                </div>
            </form>
        </div>

        <div class="bottom-contact">
            <div class="contact-header">
                <h2>Contact Information</h2>
                <p>We're open for any suggestion or just to have a chat</p>
            </div>

            <ul class="contact-details">
                <li>
                    <i class="fas fa-map-marker-alt"></i>
                    <div class="contact-text">
                        Waystem HQ, Tiswadi Panaji - 403001 Goa India
                    </div>
                </li>
                <li>
                    <i class="fas fa-phone"></i>
                    <div class="contact-text">
                        +91 xxxxxxxxxx
                    </div>
                </li>
                <li>
                    <i class="fas fa-envelope"></i>
                    <div class="contact-text">
                        waystem@protonmail.com
                    </div>
                </li>
            </ul>

            <div class="social-section">
                <div class="social-icons">
                    <a href="https://facebook.com/Waystem" target="_blank" class="facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="https://instagram.com/waystem" target="_blank" class="instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://x.com/waystem" target="_blank" class="twitter">
                        <i class="fab fa-x-twitter"></i>
                    </a>
                    <a href="https://youtube.com/Waystem" target="_blank" class="youtube">
                        <i class="fab fa-youtube"></i>
                    </a>
                    <a href="https://linkedin.com/company/waystem" target="_blank" class="linkedin">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Waystem</p>
    </footer>

</body>

</html>
